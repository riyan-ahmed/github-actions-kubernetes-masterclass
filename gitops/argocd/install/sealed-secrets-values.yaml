# Sealed Secrets, scoped to the SANDBOX only (chart bitnamicharts/sealed-secrets 2.22.0, controller 0.41.2).
# Default chart: a ClusterRole that can get/list/create/update/DELETE Secrets in EVERY namespace. Not acceptable here.
# This file: no ClusterRole at all; the controller runs in its own namespace `sealed-secrets` and gets a namespaced Role
# only in `sealed-secrets` (its own key) and `skillpulse-gitops` (the sandbox). It cannot see any other namespace.
# Verified on a disposable kind cluster: controller Ready with 0 errors; a sealed secret unsealed in skillpulse-gitops
# and was NOT unsealed when replayed into another namespace. To seal for stg/prd later, add that namespace here (reviewed).
fullnameOverride: sealed-secrets-controller
additionalNamespaces: [sealed-secrets, skillpulse-gitops]
rbac:
  clusterRole: false
  namespacedRoles: true
resources:
  requests: {cpu: 25m, memory: 32Mi}
  limits: {memory: 128Mi}
args:                                  # replaces the chart defaults; the two namespace flags are the point
  - --update-status
  - --key-prefix=sealed-secrets-key
  - --all-namespaces=false
  - --additional-namespaces=skillpulse-gitops,sealed-secrets
  - --listen-addr=:8080
  - --listen-metrics-addr=:8081
