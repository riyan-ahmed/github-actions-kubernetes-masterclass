# Dedicated AppProject for the oom-demo Application. The existing "skillpulse" project is untouched.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: oom-demo
  namespace: argocd
spec:
  description: Isolated GitOps self-healing demo workload. Deployment only, sandbox namespace only, no cluster-scoped resources.
  sourceRepos:
    - https://github.com/riyan-ahmed/skillpulse-gitops-self-healing.git
  destinations:
    - {server: https://kubernetes.default.svc, namespace: skillpulse-gitops}
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - {group: apps, kind: Deployment}
  orphanedResources:
    warn: true
