apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: skillpulse-sandbox
  namespace: argocd
  annotations:
    aiops.skillpulse/note: "NON-ADOPTING: new namespace skillpulse-gitops. Sync this first to prove the Argo CD flow without touching any existing workload."
spec:
  project: skillpulse
  source:
    repoURL: https://github.com/riyan-ahmed/github-actions-kubernetes-masterclass.git
    targetRevision: main
    path: k8s/gitops/sandbox
  destination:
    server: https://kubernetes.default.svc
    namespace: skillpulse-gitops
  # MANUAL SYNC ONLY: no `automated` block (so no auto-sync, no self-heal, no auto-prune) and no
  # resources-finalizer (deleting this Application never cascades to the workloads).
  # Pruning stays off even on a manual sync: every object carries argocd.argoproj.io/sync-options=Prune=false.
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
  revisionHistoryLimit: 5
