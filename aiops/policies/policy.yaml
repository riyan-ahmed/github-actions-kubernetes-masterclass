# Deterministic remediation policy for the SkillPulse AIOps agent.
# This file, not an LLM, decides what may ever happen. Change it only through a reviewed PR.
version: 1

global:
  # Master switch for unattended actions. Even when true, AIOPS_MODE=auto and
  # AIOPS_DRY_RUN=false must also be set. Shipped disabled.
  auto_remediation_enabled: false
  min_confidence_for_execution: 0.6
  max_executions_per_workload_per_hour: 2
  memory_limit_cap: 512Mi          # propose_config_pr may never propose more than this
  pr_path_prefixes: [k8s/gitops/]  # a pull request may only touch files under these prefixes
  supported_kinds: [Deployment]      # default-deny: any other kind is never a remediation target
  forbidden_kinds: [StatefulSet, PersistentVolumeClaim, Secret, Namespace, Node, Service]

environments:
  skillpulse-stg:
    tier: staging
    # The ONLY workloads the agent may modify in the cluster. backend, frontend and
    # mysql are deliberately absent: they stay read-only.
    write_allowlist:
      - {kind: Deployment, name: backend-sim}
    allowed_actions: [rollout_undo, restart_deployment, propose_config_pr, escalate_human]
    approval_required_actions: [rollout_undo, propose_config_pr]
    auto_actions: [restart_deployment]

  skillpulse-prd:
    tier: production
    write_allowlist: []            # production is never written by the agent
    allowed_actions: [propose_config_pr, escalate_human]
    approval_required_actions: [propose_config_pr]
    auto_actions: []

  # Isolated GitOps demo namespace (the Argo CD sandbox). The agent can NEVER write to workloads here:
  # write_allowlist is empty and rollout_undo / restart_deployment are not allowed. Its only effect is a pull
  # request against the one file listed in gitops_targets; the human merge is the approval.
  skillpulse-gitops:
    tier: sandbox
    write_allowlist: []
    allowed_actions: [propose_config_pr, escalate_human]
    approval_required_actions: []
    auto_actions: []
    pr_without_preapproval: [propose_config_pr]

# Where propose_config_pr may write (repository paths); a human merges. Argo CD syncs stg/prd manually; the
# oom-demo Application (argocd_app) syncs automatically after the merge, with pruning disabled.
gitops_targets:
  skillpulse-stg:
    backend: {path: k8s/gitops/stg/patches/backend-resources.yaml, container: backend}
  skillpulse-prd:
    backend: {path: k8s/gitops/prd/patches/backend-resources.yaml, container: backend}
  skillpulse-gitops:
    oom-demo:
      path: k8s/gitops/oom-demo/patches/resources.yaml
      container: oom-demo
      patch_requests: false          # the PR changes limits.memory and nothing else
      argocd_app: oom-demo
