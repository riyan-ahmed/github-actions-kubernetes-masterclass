# backend-sim v1: the HEALTHY baseline of the simulation workload. Revision 1 of the Deployment.
#
# Isolation (why this cannot hurt the real application):
#  * its own Deployment named backend-sim, label app=backend-sim; NO Service selects it, so no user,
#    frontend, or probe traffic other than its own kubelet probes ever reaches it;
#  * the real Service `backend` selects app=backend, and the frontend talks to that Service;
#  * it starts the same backend image, which on start only opens a connection and pings MySQL
#    (no migrations, no writes); it is never sent requests, so it issues no queries;
#  * it is not touched by any Argo CD application (none exists) and is the only workload the agent's
#    policy would ever be allowed to modify (and today the agent's RBAC grants no write at all).
# Credentials come from the existing Secret skillpulse-db through secretKeyRef (injected by the kubelet).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-sim
  namespace: skillpulse-stg
  labels:
    app: backend-sim
    aiops.skillpulse/simulation: "true"
  annotations:
    kubernetes.io/change-cause: "v1 healthy baseline (PORT=8080)"
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: backend-sim
  template:
    metadata:
      labels:
        app: backend-sim
        aiops.skillpulse/simulation: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532          # the backend image's own non-root user
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: trainwithshubham/skillpulse-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - {name: DB_HOST, value: mysql}
            - {name: DB_PORT, value: "3306"}
            - {name: PORT, value: "8080"}
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: skillpulse-db, key: MYSQL_USER}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: skillpulse-db, key: MYSQL_PASSWORD}}
            - name: DB_NAME
              valueFrom: {secretKeyRef: {name: skillpulse-db, key: MYSQL_DATABASE}}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 5
