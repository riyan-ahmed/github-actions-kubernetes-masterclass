apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-agent
  namespace: aiops
  labels: {app: aiops-agent}
spec:
  replicas: 1
  strategy: {type: Recreate}            # the audit PVC is ReadWriteOnce
  selector:
    matchLabels: {app: aiops-agent}
  template:
    metadata:
      labels: {app: aiops-agent}
    spec:
      serviceAccountName: aiops-agent
      securityContext:
        runAsNonRoot: true
        # 10001 (not the image default 65532) on purpose: the existing aiops-data PVC is owned by 10001.
        # Changing the uid would make the audit log unwritable without a data migration.
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent
          image: skillpulse-aiops-agent:0.4.0      # built locally (Chainguard base, 0 Trivy findings) and `kind load`ed; never pulled
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8085}
          env:
            # ---- safety posture: read-only diagnosis, dry run, no auto-remediation ----
            - {name: AIOPS_MODE, value: diagnose}
            - {name: AIOPS_DRY_RUN, value: "true"}
            - {name: AIOPS_POLICY_FILE, value: /etc/aiops/policy.yaml}
            - {name: AIOPS_AUDIT_DIR, value: /data/audit}
            - {name: AIOPS_PROMETHEUS_URL, value: "http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090"}
            - {name: AIOPS_LOKI_URL, value: "http://loki.monitoring.svc:3100"}
            - {name: AIOPS_LLM_PROVIDER, value: none}        # deterministic reasoner only
            - {name: AIOPS_GITHUB_ENABLED, value: "false"}
            # ---- credentials only via Secret references (required: no `optional: true`) ----
            - name: AIOPS_WEBHOOK_TOKEN
              valueFrom: {secretKeyRef: {name: aiops-webhook, key: token}}
            - name: AIOPS_APPROVAL_TOKEN
              valueFrom: {secretKeyRef: {name: aiops-approval, key: token}}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: policy, mountPath: /etc/aiops, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: aiops-data}
        - name: policy
          configMap: {name: aiops-policy}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
